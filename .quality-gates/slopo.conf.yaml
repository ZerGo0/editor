source_dir: .
source_dir_exclude:
  - ".git/"
  - ".aislop/"
  - ".fallow/"
  - ".slopo/"
  - ".task/"
  - ".mygo/"
  - "**/.astro/"
  - "**/.cache/"
  - "**/.next/"
  - "**/.nyc_output/"
  - "**/.output/"
  - "**/.parcel-cache/"
  - "**/.svelte-kit/"
  - "**/.venv/"
  - "**/.wrangler/"
  - "**/.wxt/"
  - "**/build/"
  - "**/coverage/"
  - "**/dist/"
  - "**/node_modules/"
  - "**/out/"
  - "**/test-results/"
  - "**/vendor/"
  - "**/*.generated.ts"
  - "**/*.pb.go"
  - "**/*_gen.go"
  - "internal/icons/*.svg"
  - "internal/fileicons/svg/"
  - ".agents/"
  - "**/*.d.ts"
  - "**/*.po"
  - "**/src/locale/"
  - "**/src/locales/"

embedding_model: jina_ai/jina-code-embeddings-0.5b
embedding_dimensions: 256
embedding_api_key: local
embedding_params:
  api_base: http://127.0.0.1:17998/v1
  task: code2code.query
embedding_batch_size: 32
embedding_batch_chars: 24000
